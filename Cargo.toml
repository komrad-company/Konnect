[package]
name = "konnect"
version = "0.1.0"
edition = "2024"

description = "PostgreSQL connection and pool management for the Komrad ecosystem"
license = "AGPL-3.0-or-later"
readme = "README.md"

repository = "https://github.com/komrad-company/Konnect"

[dependencies]
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
